<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>MONGDEE MINI KIOSK</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="kiosk">
    <section class="cam-pane" aria-label="กล้องสแกนสินค้า">
      <div class="cam-stage">
        <img class="cam-blur-bg" src="/api/camera/stream" alt="" aria-hidden="true">
        <div class="cam-frame" id="camFrame">
          <div class="cam-crop" id="camCrop">
            <img id="kioskCamera" src="/api/camera/stream" alt="ภาพสดจากกล้องสำหรับสแกนสินค้า">
            <div class="detect-box" id="detectBox"><span class="detect-label" id="detectLabel"></span></div>
          </div>
        </div>
        <div class="status-badge" id="statusBadge" role="status">กำลังเชื่อมต่อ…</div>
        <span class="cam-hint" id="camHint">หยิบสินค้าขึ้นมาให้กล้องเห็นในกรอบ</span>
      </div>
    </section>

    <div class="guide-pane">
      <aside class="cam-guide" aria-label="ขั้นตอนการใช้งาน">
        <div class="guide-title">วิธีใช้งาน</div>
        <ol class="guide-steps" id="guideSteps"></ol>
        <div class="guide-hint" id="guideHint" role="status"></div>
      </aside>
      <section class="info-pane" id="infoPane" aria-live="polite" aria-label="รายละเอียดสินค้า"></section>
    </div>
  </main>

  <dialog id="productPopup" class="product-popup" aria-label="รายละเอียดสินค้า">
    <div id="popupContent" class="popup-content"></div>
  </dialog>

  <div class="admin-menu-wrap">
    <button type="button" id="adminMenuBtn" class="admin-menu-btn" aria-label="เมนูผู้ดูแลระบบ" aria-expanded="false">⚙</button>
    <nav id="adminMenu" class="admin-menu" aria-label="ผู้ดูแลระบบ">
      <a href="/products">สินค้าทั้งหมด</a>
      <a href="/enroll">เพิ่มสินค้า</a>
      <a href="/manage">จัดการสินค้า</a>
      <a href="/dashboard">รายงาน</a>
      <a href="/calibrate">ปรับตั้งค่ากล้อง</a>
      <button type="button" id="uiSoundToggle" class="menu-toggle"></button>
    </nav>
  </div>
  <button type="button" id="muteBtn" class="mute-btn" aria-label="เปิด/ปิดเสียง"></button>

  <script src="/static/js/ui-sound.js"></script>
  <script src="/static/js/media-fallback.js"></script>
  <script src="/static/js/detect-box.js"></script>
  <script src="/static/js/spin-viewer.js"></script>
  <script src="/static/js/price.js"></script>
  <script src="/static/js/kiosk.js"></script>
</body>
</html>
