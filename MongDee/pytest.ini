[pytest]
testpaths = tests
python_files = test_*.py
; tests/manual/ holds standalone diagnostic scripts (real-hardware camera
; backend probes -- see docs/MULTI_CAMERA_ROOT_CAUSE_REPORT.md) that open
; real USB cameras and run top-level code with side effects at import time.
; They are named test_*.py per that investigation's own naming request, so
; python_files above would otherwise make a plain `pytest`/`pytest tests/`
; import and execute them as if they were real tests -- excluded here so
; the normal (hardware-free, mocked) suite never touches real cameras or
; spawns their subprocesses. Run them directly with
; `python tests/manual/test_*.py` instead.
norecursedirs = tests/manual
; tmp_path/tmp_path_factory otherwise create numbered dirs under the OS
; temp dir, which on Windows is %TEMP% (usually the C: drive) — pin it
; next to the project instead so a full/small C: drive can't break tests.
addopts = -m "not slow" --basetemp=.pytest_tmp
markers =
    slow: exercises real model weights / real inference (run with: pytest -m slow)
