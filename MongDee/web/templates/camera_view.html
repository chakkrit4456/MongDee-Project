<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ camera_id }} — MONGDEE AI Booth OS</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" href="/static/favicon-180.png">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { padding: 0; margin: 0; background: #000; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .cam-header {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: var(--navbar-bg); border-bottom: 1px solid var(--panel-border); flex-shrink: 0;
  }
  .cam-header strong { font-size: 14px; }
  .cam-body { flex: 1; display: flex; min-height: 0; }
  .cam-stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; min-width: 0; }
  .cam-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .cam-stage:fullscreen, .cam-stage:-webkit-full-screen { background: #000; }
  .cam-stage:fullscreen img, .cam-stage:-webkit-full-screen img { max-width: 100vw; max-height: 100vh; }

  .cam-detail-panel {
    width: 240px; flex-shrink: 0; overflow-y: auto; padding: 14px;
    background: var(--bg-elevated); border-left: 1px solid var(--panel-border);
  }
  .cam-detail-panel h4 {
    margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-dim);
  }
  .cam-stat-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--panel-border); font-size: 13px;
  }
  .cam-stat-row:last-child { border-bottom: none; }
  .cam-stat-label { display: flex; align-items: center; gap: 8px; color: var(--text-dim); }
  .cam-stat-value { font-size: 16px; font-weight: 600; }
  .cam-stat-total .cam-stat-value { font-size: 22px; }
</style>
</head>
<body>
<div class="cam-header">
  <span class="status-dot status-unknown" id="dot-{{ camera_id }}"></span>
  <strong>{{ camera_id }}</strong>
  <span class="status-text" id="status-{{ camera_id }}">กำลังเชื่อมต่อ...</span>
  <div class="spacer"></div>
  <button id="fullscreen-btn" title="ดูกล้องนี้แบบเต็มจอ"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>เต็มจอ</button>
</div>
<div class="cam-body">
  <div class="cam-stage" id="cam-stage">
    <img src="/stream/{{ camera_id }}" alt="{{ camera_id }}">
  </div>
  <div class="cam-detail-panel" id="cam-detail-panel">
    <h4>คนในกล้องนี้ตอนนี้</h4>
    <div class="cam-stat-row cam-stat-total">
      <span class="cam-stat-label"><svg class="icon-inline" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>ทั้งหมด</span>
      <span class="cam-stat-value" id="cam-detail-people-total">–</span>
    </div>
    <div class="cam-stat-row">
      <span class="cam-stat-label"><span class="dot dot-male"></span>ชาย</span>
      <span class="cam-stat-value" id="cam-detail-male">–</span>
    </div>
    <div class="cam-stat-row">
      <span class="cam-stat-label"><span class="dot dot-female"></span>หญิง</span>
      <span class="cam-stat-value" id="cam-detail-female">–</span>
    </div>
    <div class="cam-stat-row">
      <span class="cam-stat-label"><span class="dot dot-unknown"></span>ไม่ทราบ</span>
      <span class="cam-stat-value" id="cam-detail-unknown">–</span>
    </div>
    <h4 style="margin-top:18px;">สินค้าที่ตรวจพบ</h4>
    <div class="cam-stat-row cam-stat-total">
      <span class="cam-stat-label"><span class="dot dot-product"></span>ชิ้นในเฟรมนี้</span>
      <span class="cam-stat-value" id="cam-detail-products">–</span>
    </div>
  </div>
</div>

<script>
const CAMERA_ID = "{{ camera_id }}";
</script>
<script src="/static/icons.js"></script>
<script src="/static/camera_view.js"></script>
</body>
</html>
