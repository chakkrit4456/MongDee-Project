<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONGDEE AI Booth OS — ดูสินค้า</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" href="/static/favicon-180.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="top-bar">
  <a href="/" class="brand-link"><img class="brand-logo" src="/static/logo.png" alt="MongDee"></a>
  <a href="/booth" style="color:var(--text-dim); text-decoration:none;">← กลับไปหน้าบูธ</a>
  <div class="title">ดูสินค้า &middot; {{ booth_name }} &middot; {{ event_id }}</div>
  <div class="spacer"></div>
  <button id="theme-toggle-btn" class="theme-toggle-btn" title="สลับโหมดมืด/สว่าง"></button>
</div>

<div class="legend">
  <span class="dot dot-product"></span>สินค้า (Product)
  <span class="dot dot-person"></span>คน — ไม่ทราบเพศ (Unknown)
  <span class="dot dot-female"></span>คน — ผู้หญิง
  <span class="dot dot-male"></span>คน — ผู้ชาย
  <span class="dot dot-unknown"></span>พบวัตถุแต่ยังไม่รู้จัก (ควรเทรน)
</div>

<div class="cam-grid" id="cam-grid"></div>

<div class="panel assistant-panel product-view-panel">
  <h3><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.5" r="0.9" fill="currentColor" stroke="none"/></svg>ข้อมูลสินค้า</h3>
  <div class="product-name" id="product-name">ยังไม่พบสินค้า — วางสินค้าในกรอบกล้องเพื่อเริ่มต้น</div>
  <div class="product-tagline" id="product-tagline"></div>
  <div class="product-price" id="product-price"></div>
  <div class="product-desc" id="product-desc"></div>
  <div class="product-source" id="product-source"></div>
  <div class="faq-list" id="faq-list"></div>

  <label style="margin-top:14px;"><svg class="icon-inline" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>ประวัติการโต้ตอบ</label>
  <div class="history-list" id="history-list"></div>
</div>

<script src="/static/icons.js"></script>
<script src="/static/theme.js"></script>
<script src="/static/cam_grid.js"></script>
<script src="/static/product_view.js"></script>
</body>
</html>
